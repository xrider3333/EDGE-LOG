# EDGE-LOG needrestart override (CHANGE_CONTROL.md "Automatic Ubuntu upgrades", option a).
# Installed on the Oracle box as /etc/needrestart/conf.d/edgelog.conf by
# deploy/cloud/install_needrestart_override.sh (run from tools/box_deploy.py
# --install-needrestart-override). Never let needrestart auto-restart the live
# book services after an unattended library upgrade. The library upgrade still
# gets installed; the SERVICE restart happens only through tools/box_deploy.py,
# on the owner's schedule, with the book flat.
#
# 0 in override_rc = "treat as already restarted / does not need a restart" --
# the same mechanism the stock needrestart.conf uses for docker, NetworkManager...
$nrconf{override_rc}{'^edgelog-qqq-exec\.service$'} = 0;
$nrconf{override_rc}{'^edgelog-cloud-signal\.service$'} = 0;
# Belt and braces: never ask interactively (there is no terminal under
# unattended-upgrades) and never restart on its own -- list only.
$nrconf{restart} = 'l';
